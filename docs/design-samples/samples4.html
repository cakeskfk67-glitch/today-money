<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>움직이는 샘플 (코인·코스)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 12px 30px; background: #cfd6e2; font-family: "Malgun Gothic", system-ui, sans-serif; color: #3a2a12; }
  h1 { text-align: center; font-size: 18px; margin: 0 0 4px; }
  .sub { text-align: center; font-size: 13px; color: #555; margin: 0 0 12px; }
  .wrap { width: 330px; margin: 0 auto; }
  .controls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .controls button { border: 2px solid #333; background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .controls button:active { transform: translateY(1px); }
  .phone { width: 330px; height: 660px; border-radius: 28px; border: 6px solid #1a1a1a; overflow: hidden; position: relative; background: linear-gradient(#5ec2ff 0, #bde9ff 60%, #e9f8ff 100%); }
  .screen { height: 100%; overflow: hidden; padding: 14px 14px 72px; position: relative; }

  /* 흘러가는 구름 */
  .cloud { position: absolute; width: 56px; height: 20px; background: #fff; border-radius: 999px; opacity: .9; animation: drift linear infinite; }
  .cloud:before { content: ""; position: absolute; left: 10px; top: -10px; width: 26px; height: 22px; background: #fff; border-radius: 50%; }
  @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(420px); } }

  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; position: relative; }
  .date { background: #fff; border: 3px solid #3a2a12; border-radius: 10px; padding: 2px 10px; font-size: 12px; font-weight: 800; }
  .coinsum { background: #ffd23f; border: 3px solid #3a2a12; border-radius: 10px; padding: 2px 10px; font-size: 12px; font-weight: 800; }

  .npc { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 8px; position: relative; }
  .face { width: 56px; height: 56px; flex-shrink: 0; }
  .face svg { width: 100%; height: 100%; overflow: visible; }
  .face .mouth { display: none; }
  .ok .face .m-ok, .warn .face .m-warn, .bad .face .m-bad { display: block; }
  .face .tear { display: none; }
  .bad .face .tear { display: block; animation: tear 1s ease-in infinite; }
  @keyframes tear { from { transform: translateY(0); opacity: 1; } to { transform: translateY(10px); opacity: 0; } }
  .face svg { animation: bob 1.2s ease-in-out infinite; transform-origin: 50% 100%; }
  .warn .face svg { animation: shake .5s ease-in-out infinite; }
  .bad .face svg { animation: droop 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-5px) scale(.97,1.03); } }
  @keyframes shake { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes droop { 0%,100% { transform: translateY(2px) scale(1.03,.95); } 50% { transform: translateY(3px) scale(1.04,.93); } }
  .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

  .bubble { position: relative; flex: 1; background: #fff; border: 3px solid #3a2a12; border-radius: 14px; padding: 8px 10px; font-size: 13px; line-height: 1.4; min-height: 52px; }
  .bubble:before { content: ""; position: absolute; left: -11px; bottom: 14px; border: 7px solid transparent; border-right: 9px solid #3a2a12; }
  .bubble b { color: #e0402f; }

  .panel { background: #fffdf3; border: 3px solid #3a2a12; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 4px 0 #3a2a12; position: relative; }
  .big { text-align: center; font-size: 12px; margin: 0; }
  .num { text-align: center; font-size: 40px; font-weight: 900; color: #e0402f; margin: 0 0 6px; letter-spacing: -1px; text-shadow: 2px 2px 0 #ffd23f; transition: color .3s; }
  .num small { font-size: 18px; color: #3a2a12; text-shadow: none; }
  .warn .num { color: #e07a00; }
  .bad .num { color: #c4161c; animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  .coins { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .coins i { aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2a0, #ffc300 60%, #d99a00); border: 2px solid #3a2a12; animation: spin 2.4s ease-in-out infinite; }
  .coins i:nth-child(2n) { animation-delay: .3s; }
  .coins i:nth-child(3n) { animation-delay: .6s; }
  @keyframes spin { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.55); } }
  .coins i.gone { background: #d9d2c0; border-style: dashed; border-color: #a99f86; animation: none; }
  .coins i.pop { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(1); background: #ffc300; } 40% { transform: translateY(-14px) scale(1.3); } 100% { transform: translateY(0) scale(1); } }
  .hint { text-align: center; font-size: 11px; margin: 6px 0 0; color: #7a6540; }
  .float { position: absolute; right: 16px; top: 34px; font-weight: 900; color: #c4161c; font-size: 16px; pointer-events: none; animation: floatup 1s ease-out forwards; }
  @keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-28px); opacity: 0; } }

  .course { margin-bottom: 8px; position: relative; padding-top: 20px; }
  .course p { margin: 0 0 2px; font-size: 11px; font-weight: 800; position: absolute; left: 0; top: 0; }
  .road { position: relative; height: 18px; background: #8bd24b; border: 3px solid #3a2a12; border-radius: 999px; }
  .road .done { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: repeating-linear-gradient(90deg, #6bb832 0 10px, #7cc93f 10px 20px); border-radius: 999px; transition: width 1s ease-in-out; }
  .hero { position: absolute; top: -26px; left: 0; width: 26px; height: 26px; transform: translateX(-50%); transition: left 1s ease-in-out; }
  .hero.walk svg { animation: hop .25s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-6px); } }
  .flag { position: absolute; right: 2px; top: -22px; font-size: 18px; transform-origin: 20% 100%; animation: wave 1.4s ease-in-out infinite; }
  @keyframes wave { 50% { transform: skewX(-8deg); } }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .grid div { background: #fffdf3; border: 3px solid #3a2a12; border-radius: 12px; padding: 5px 10px; }
  .grid span { display: block; font-size: 11px; color: #7a6540; }
  .grid b { font-size: 15px; }
  .btn { width: 100%; border: 3px solid #3a2a12; background: #ff5a4f; color: #fff; font-weight: 900; font-size: 15px; padding: 10px; border-radius: 12px; box-shadow: 0 4px 0 #a82a22; font-family: inherit; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a82a22; }

  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; background: #c9753a; border-top: 4px solid #3a2a12; color: #fff; }
  .tabs span { padding: 2px 8px; border-radius: 6px; text-align: center; }
  .tabs em { display: block; font-style: normal; font-size: 19px; }
  .tabs .on { background: #ffd23f; color: #3a2a12; font-weight: 800; border: 2px solid #3a2a12; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<h1>움직이는 샘플 (코인·코스)</h1>
<p class="sub">아래 버튼을 눌러 보세요. 쓰는 돈에 따라 캐릭터 표정과 동작이 바뀝니다.</p>

<div class="wrap">
  <div class="controls">
    <button id="b1">1,000원 쓰기</button>
    <button id="b2">10,000원 쓰기</button>
    <button id="b3">다음 날로</button>
    <button id="b4">처음으로</button>
  </div>

  <div class="phone">
    <div class="screen ok" id="screen">
      <span class="cloud" style="top:40px; animation-duration:26s"></span>
      <span class="cloud" style="top:130px; animation-duration:38s; animation-delay:-14s; transform:scale(.7)"></span>

      <div class="top">
        <span class="date" id="date">11월 20일</span>
        <span class="coinsum">💰 이번 달 남은 용돈</span>
      </div>

      <div class="npc">
        <div class="face" id="face">
          <svg viewBox="0 0 60 60" aria-label="캐릭터">
            <ellipse cx="20" cy="56" rx="8" ry="4" fill="#3a2a12"/>
            <ellipse cx="40" cy="56" rx="8" ry="4" fill="#3a2a12"/>
            <circle cx="30" cy="31" r="25" fill="#ff9a3c" stroke="#3a2a12" stroke-width="3"/>
            <circle cx="16" cy="38" r="4" fill="#ff6f61" opacity=".6"/>
            <circle cx="44" cy="38" r="4" fill="#ff6f61" opacity=".6"/>
            <ellipse class="eye" cx="22" cy="28" rx="3.2" ry="4.6" fill="#3a2a12"/>
            <ellipse class="eye" cx="38" cy="28" rx="3.2" ry="4.6" fill="#3a2a12"/>
            <circle cx="23" cy="26.5" r="1.2" fill="#fff"/>
            <circle cx="39" cy="26.5" r="1.2" fill="#fff"/>
            <g class="mouth m-ok"><path d="M22 40 Q30 49 38 40" fill="none" stroke="#3a2a12" stroke-width="3" stroke-linecap="round"/></g>
            <g class="mouth m-warn"><path d="M23 44 Q30 40 37 44" fill="none" stroke="#3a2a12" stroke-width="3" stroke-linecap="round"/><path d="M48 14 q3 4 0 7 q-3 -3 0 -7" fill="#6ecbff" stroke="#3a2a12" stroke-width="1.5"/></g>
            <g class="mouth m-bad"><path d="M23 46 Q30 38 37 46" fill="none" stroke="#3a2a12" stroke-width="3" stroke-linecap="round"/><path class="tear" d="M20 34 q3 5 0 8 q-3 -3 0 -8" fill="#6ecbff" stroke="#3a2a12" stroke-width="1.5"/></g>
          </svg>
        </div>
        <div class="bubble" id="bubble"></div>
      </div>

      <div class="panel">
        <p class="big" id="biglabel">오늘 쓸 수 있는 돈</p>
        <p class="num" id="num">0<small>원</small></p>
        <div class="coins" id="coins"></div>
        <p class="hint" id="hint"></p>
      </div>

      <div class="course">
        <p id="coursetext"></p>
        <div class="road">
          <div class="done" id="done"></div>
          <div class="hero" id="hero">
            <svg viewBox="0 0 60 60"><circle cx="30" cy="32" r="24" fill="#ff9a3c" stroke="#3a2a12" stroke-width="5"/><circle cx="22" cy="28" r="4" fill="#3a2a12"/><circle cx="38" cy="28" r="4" fill="#3a2a12"/></svg>
          </div>
          <span class="flag">🚩</span>
        </div>
      </div>

      <div class="grid">
        <div><span>오늘 한도</span><b id="limit"></b></div>
        <div><span>오늘 쓴 돈</span><b id="spent"></b></div>
      </div>
      <button class="btn" id="btnadd">지출 기록하기 (1,000원)</button>
    </div>
    <div class="tabs"><span class="on"><em>🏠</em>오늘</span><span><em>📋</em>내역</span><span><em>📊</em>통계</span></div>
  </div>
</div>

<script>
  var LIMIT = 45454, DAYS = 30;
  var spent = 10000, day = 20, shownLeft = 0;
  var $ = function (id) { return document.getElementById(id); };
  var won = function (n) { return n.toLocaleString("ko-KR") + "원"; };

  function level() {
    var r = spent / LIMIT;
    return r > 1 ? "bad" : r >= 0.8 ? "warn" : "ok";
  }

  function animateNumber(to) {
    var from = shownLeft, start = null;
    shownLeft = to;
    function step(t) {
      if (start === null) start = t;
      var p = Math.min(1, (t - start) / 450);
      var v = Math.round(from + (to - from) * p);
      var over = v < 0;
      $("num").innerHTML = (over ? Math.abs(v).toLocaleString("ko-KR") : v.toLocaleString("ko-KR")) + "<small>원" + (over ? " 초과" : "") + "</small>";
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function render(popFrom) {
    var left = LIMIT - spent, lv = level();
    $("screen").className = "screen " + lv;
    $("date").textContent = "11월 " + day + "일";
    $("biglabel").textContent = left < 0 ? "오늘 한도를 넘었어요" : "오늘 쓸 수 있는 돈";
    animateNumber(left);

    var used = Math.min(10, Math.floor(spent / LIMIT * 10));
    var html = "";
    for (var i = 0; i < 10; i++) {
      var cls = i < used ? "gone" : "";
      if (popFrom !== undefined && i >= popFrom && i < used) cls += " pop";
      html += '<i class="' + cls + '"></i>';
    }
    $("coins").innerHTML = html;
    $("hint").textContent = "오늘 한도의 " + Math.round(spent / LIMIT * 100) + "% 사용 · 코인 한 칸 = " + won(Math.round(LIMIT / 10));

    var msg = {
      ok: "오늘은 <b>" + won(Math.max(left, 0)) + "</b>까지 쓸 수 있어요! 아직 코인이 넉넉해요.",
      warn: "코인이 얼마 안 남았어요! <b>" + won(Math.max(left, 0)) + "</b>만 더 쓸 수 있어요.",
      bad: "앗, 오늘 한도를 <b>" + won(Math.abs(left)) + "</b> 넘었어요. 내일은 조금만 아껴 봐요."
    };
    $("bubble").innerHTML = msg[lv];

    $("limit").textContent = won(LIMIT);
    $("spent").textContent = won(spent);
    $("coursetext").textContent = "월말까지 " + day + "일 / " + DAYS + "일";
    var pct = (day / DAYS * 100) + "%";
    $("done").style.width = pct;
    $("hero").style.left = pct;
  }

  function spend(amount) {
    var before = Math.min(10, Math.floor(spent / LIMIT * 10));
    spent += amount;
    render(before);
    var f = document.createElement("span");
    f.className = "float";
    f.textContent = "-" + amount.toLocaleString("ko-KR");
    document.querySelector(".panel").appendChild(f);
    setTimeout(function () { f.remove(); }, 1000);
  }

  function walk() {
    var h = $("hero");
    h.classList.add("walk");
    setTimeout(function () { h.classList.remove("walk"); }, 1000);
  }

  $("b1").onclick = $("btnadd").onclick = function () { spend(1000); };
  $("b2").onclick = function () { spend(10000); };
  $("b3").onclick = function () { if (day < DAYS) { day++; spent = 0; walk(); render(); } };
  $("b4").onclick = function () { day = 20; spent = 10000; walk(); render(); };

  // 처음 열 때: 0에서 현재 값까지 올라가고, 캐릭터가 코스 위치까지 걷는다
  $("hero").style.left = "0%"; $("done").style.width = "0%";
  setTimeout(function () { walk(); render(); }, 150);
</script>
</body>
</html>
