<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 쓸 수 있는 돈</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 기본은 게임식 디자인(game). 주소 끝에 ?theme=toss | neon | fantasy | soft 를 붙이면 다른 디자인
    // neon / fantasy / soft 는 game.css(구조) 위에 자기 스타일 파일을 한 겹 더 입힌다.
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      if (t === "toss") return;
      var extra = { neon: 1, fantasy: 1, soft: 1 };
      var root = document.documentElement;
      function addCss(name) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = name + ".css";
        document.head.appendChild(link);
      }
      // adventure: 장면(캐릭터가 달리는 초원)과 하단 입력창이 있는 게임 화면 디자인. 단독으로 쓰는 스타일 파일.
      // calm: adventure 와 같은 장면을 더 차분하고 정돈된 모습으로 덮어쓴 버전 (기본 디자인)
      if (t === "calm" || !t) {
        root.classList.add("theme-adventure", "theme-calm");
        addCss("adventure");
        addCss("calm");
        return;
      }
      if (t === "adventure") {
        root.classList.add("theme-adventure");
        addCss("adventure");
        return;
      }
      root.classList.add("theme-game");
      addCss("game");
      if (extra[t]) {
        root.classList.add("theme-" + t);
        addCss(t);
      }
    })();
  </script>
</head>
<body>
  <main class="app">

    <!-- 1) 첫 화면: 이번 달 예산 입력 -->
    <section id="setup" class="card" hidden>
      <h1>오늘 쓸 수 있는 돈</h1>
      <p class="hint">이번 달 용돈(예산)을 입력하면<br>오늘 하루 쓸 수 있는 금액을 알려 드려요.</p>
      <form id="budget-form">
        <label for="budget-input">이번 달 용돈</label>
        <div class="input-row">
          <input id="budget-input" type="text" inputmode="numeric" placeholder="예: 300000" autocomplete="off" required>
          <span class="unit">원</span>
        </div>
        <p id="budget-error" class="error" hidden></p>
        <button type="submit" class="primary">시작하기</button>
      </form>
    </section>

    <!-- 2) 메인 화면 -->
    <section id="main" hidden>
      <header class="top">
        <span id="today-label"></span>
        <button id="reset-budget" class="link" type="button">예산 다시 설정</button>
      </header>

      <div id="tab-today" class="tab-panel">
      <!-- adventure 디자인 전용: 캐릭터가 달리는 장면 (다른 디자인에서는 숨김) -->
      <div id="a-scene" class="a-only a-scene">
        <!-- 겹겹이 다른 속도로 흘러가는 배경 (calm 디자인에서만 보임) -->
        <div class="a-layers" aria-hidden="true">
          <i class="ly ly-sun"></i>
          <img class="ly-cloud lc1" alt="" src="assets/bg/layers/cloud1.png">
          <img class="ly-cloud lc2" alt="" src="assets/bg/layers/cloud3.png">
          <img class="ly-cloud lc3" alt="" src="assets/bg/layers/cloud5.png">
          <i class="ly ly-far"></i>
          <i class="ly ly-mid"></i>
          <i class="ly ly-near"></i>
          <div class="ly-trees">
            <div class="tile"><img alt="" src="assets/bg/layers/tree.png"><img alt="" src="assets/bg/layers/treeLong.png"><img alt="" src="assets/bg/layers/tree.png"><img alt="" src="assets/bg/layers/treeLong.png"></div>
            <div class="tile"><img alt="" src="assets/bg/layers/tree.png"><img alt="" src="assets/bg/layers/treeLong.png"><img alt="" src="assets/bg/layers/tree.png"><img alt="" src="assets/bg/layers/treeLong.png"></div>
          </div>
          <i class="ly ly-ground"></i>
        </div>
        <div class="a-hud">
          <span id="a-date" class="a-pill"></span>
          <span id="a-days" class="a-pill"></span>
          <span id="a-month" class="a-pill a-pill-coin"></span>
        </div>
        <p id="a-label" class="a-label">오늘 쓸 수 있는 돈</p>
        <p id="a-amount" class="a-amount">0원</p>
        <div id="a-coins" class="a-coins" aria-hidden="true"></div>
        <img id="a-hero" class="a-hero" alt="" src="assets/hero/femaleAdventurer/character_femaleAdventurer_idle.png">
        <div id="a-bubble" class="a-bubble"></div>
        <div class="a-course" aria-hidden="true">
          <span id="a-course-text" class="a-course-text"></span>
          <div class="a-track"><i id="a-track-fill"></i><img id="a-track-hero" alt="" src="assets/hero/femaleAdventurer/character_femaleAdventurer_idle.png"><b class="a-flag">🚩</b></div>
        </div>
        <div class="a-vignette"></div>
      </div>
      <div class="card hero">
        <!-- 게임식 디자인에서만 보이는 캐릭터·말풍선 -->
        <div class="g-only g-npc" aria-hidden="true">
          <div class="g-face">
            <svg viewBox="0 0 60 60">
              <ellipse cx="20" cy="56" rx="8" ry="4" fill="#3a2a12"/>
              <ellipse cx="40" cy="56" rx="8" ry="4" fill="#3a2a12"/>
              <circle cx="30" cy="31" r="25" fill="#ff9a3c" stroke="#3a2a12" stroke-width="3"/>
              <circle cx="16" cy="38" r="4" fill="#ff6f61" opacity=".6"/>
              <circle cx="44" cy="38" r="4" fill="#ff6f61" opacity=".6"/>
              <ellipse class="g-eye" cx="22" cy="28" rx="3.2" ry="4.6" fill="#3a2a12"/>
              <ellipse class="g-eye" cx="38" cy="28" rx="3.2" ry="4.6" fill="#3a2a12"/>
              <circle cx="23" cy="26.5" r="1.2" fill="#fff"/>
              <circle cx="39" cy="26.5" r="1.2" fill="#fff"/>
              <g class="g-mouth m-ok"><path d="M22 40 Q30 49 38 40" fill="none" stroke="#3a2a12" stroke-width="3" stroke-linecap="round"/></g>
              <g class="g-mouth m-warn"><path d="M23 44 Q30 40 37 44" fill="none" stroke="#3a2a12" stroke-width="3" stroke-linecap="round"/><path d="M48 14 q3 4 0 7 q-3 -3 0 -7" fill="#6ecbff" stroke="#3a2a12" stroke-width="1.5"/></g>
              <g class="g-mouth m-bad"><path d="M23 46 Q30 38 37 46" fill="none" stroke="#3a2a12" stroke-width="3" stroke-linecap="round"/><path class="g-tear" d="M20 34 q3 5 0 8 q-3 -3 0 -8" fill="#6ecbff" stroke="#3a2a12" stroke-width="1.5"/></g>
            </svg>
          </div>
          <div id="g-bubble" class="g-bubble"></div>
        </div>
        <p class="hero-title">오늘 쓸 수 있는 돈</p>
        <p id="today-left" class="hero-amount">0원</p>
        <div id="bar" class="bar" role="progressbar" aria-label="오늘 한도 사용률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="bar-fill" class="bar-fill"></div>
        </div>
        <div id="g-coins" class="g-only g-coins" aria-hidden="true"></div>
        <p id="bar-label" class="bar-label"></p>
        <p id="today-status" class="hero-status"></p>
        <div class="g-only g-course" aria-hidden="true">
          <p id="g-course-text" class="g-course-text"></p>
          <div class="g-road">
            <div id="g-done" class="g-done"></div>
            <div id="g-walker" class="g-walker">
              <svg viewBox="0 0 60 60"><circle cx="30" cy="32" r="24" fill="#ff9a3c" stroke="#3a2a12" stroke-width="5"/><circle cx="22" cy="28" r="4" fill="#3a2a12"/><circle cx="38" cy="28" r="4" fill="#3a2a12"/></svg>
            </div>
            <span class="g-flag">🚩</span>
          </div>
        </div>
      </div>

      <div class="card summary">
        <div><span>오늘 한도</span><strong id="today-limit">0원</strong></div>
        <div><span>오늘 쓴 돈</span><strong id="today-spent">0원</strong></div>
        <div><span>이번 달 남은 예산</span><strong id="month-left">0원</strong></div>
        <div><span>남은 일수(오늘 포함)</span><strong id="days-left">0일</strong></div>
      </div>

      <button id="a-fab" type="button" class="a-only a-fab">＋ 지출 기록하기</button>
      <div id="a-backdrop" class="a-only a-backdrop"></div>
      <form id="expense-form" class="card">
        <button id="sheet-close" type="button" class="a-only a-close" aria-label="닫기">×</button>
        <h2 id="form-title">지출 기록하기</h2>
        <label for="expense-amount">금액</label>
        <div class="input-row">
          <input id="expense-amount" type="text" inputmode="numeric" placeholder="예: 4500" autocomplete="off" required>
          <span class="unit">원</span>
        </div>
        <label for="expense-category">카테고리</label>
        <select id="expense-category"></select>
        <label for="expense-memo">메모 (선택)</label>
        <input id="expense-memo" type="text" maxlength="30" placeholder="예: 점심 김밥" autocomplete="off">
        <label for="expense-date">날짜</label>
        <input id="expense-date" type="date" required>
        <p id="expense-error" class="error" hidden></p>
        <button id="expense-submit" type="submit" class="primary">추가</button>
        <button id="edit-cancel" type="button" class="secondary" hidden>수정 취소</button>
      </form>
      </div>

      <div id="tab-history" class="tab-panel" hidden>
      <div class="card">
        <h2>이번 달 지출</h2>
        <ul id="expense-list" class="list"></ul>
        <p id="empty-msg" class="hint">아직 기록한 지출이 없어요.</p>
      </div>
      </div>

      <div id="tab-stats" class="tab-panel" hidden>
      <div class="card" id="stats-card">
        <h2>이번 달 통계</h2>
        <p id="stats-empty" class="hint">지출을 기록하면 통계가 나와요.</p>
        <div id="stats-body">
          <div class="stats-top">
            <div><span>총 지출</span><strong id="stat-total">0원</strong></div>
            <div><span>하루 평균</span><strong id="stat-average">0원</strong></div>
            <div><span>가장 많이 쓴 날</span><strong id="stat-maxday">-</strong></div>
          </div>
          <h3>카테고리별</h3>
          <ul id="cat-stats" class="cat-list"></ul>
          <h3>일별 지출</h3>
          <div id="day-chart" class="day-chart"></div>
          <div id="day-axis" class="day-axis"><span>1일</span><span id="axis-mid"></span><span id="axis-last"></span></div>
        </div>
      </div>
      </div>

      <nav class="tabbar" aria-label="화면 이동">
        <button type="button" class="tab on" data-tab="today">오늘</button>
        <button type="button" class="tab" data-tab="history">내역</button>
        <button type="button" class="tab" data-tab="stats">통계</button>
      </nav>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
